    <circle cx="0" cy="-30" r="13" fill="#bc922d" stroke="#5a4218" stroke-width="3"/>
  </g>
  <g transform="translate(1275 1810)">
    <circle cx="-42" cy="9" r="12" fill="#f6efd4" stroke="#5e452c" stroke-width="3"/>
    <circle cx="0" cy="-10" r="12" fill="#f6efd4" stroke="#5e452c" stroke-width="3"/>
    <circle cx="42" cy="12" r="12" fill="#f6efd4" stroke="#5e452c" stroke-width="3"/>
  </g>

  <!-- Nøglepaneler -->
  <rect class="panel" x="100" y="1685" width="410" height="265" rx="14"/>
  <text x="125" y="1728" class="ink" style="font-size:30px;font-weight:700;">Nøgle</text>
  <text x="125" y="1766" class="legend">H01 Høststuen</text>
  <text x="125" y="1797" class="legend">H02 Vævergården</text>
  <text x="125" y="1828" class="legend">H03 Lerværket</text>
  <text x="125" y="1859" class="legend">H04 Høstmoderens hus</text>
  <text x="125" y="1890" class="legend">H05 Urtehytten</text>
  <text x="125" y="1921" class="legend">H06 Kornloftet</text>

  <rect class="panel" x="1500" y="1685" width="445" height="265" rx="14"/>
  <text x="1525" y="1728" class="legend">H07 Hjulmageren</text>
  <text x="1525" y="1759" class="legend">H08 Skovfogeden</text>
  <text x="1525" y="1790" class="legend">H09 Fåregården</text>
