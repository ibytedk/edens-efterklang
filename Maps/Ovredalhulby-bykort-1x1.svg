    <circle cx="-55" cy="-8" r="13" fill="#f2e7ca" stroke="#58432b" stroke-width="3"/>
    <circle cx="0" cy="24" r="13" fill="#f2e7ca" stroke="#58432b" stroke-width="3"/>
    <circle cx="60" cy="-24" r="13" fill="#f2e7ca" stroke="#58432b" stroke-width="3"/>
    <text x="0" y="115" text-anchor="middle" class="ink" style="font-size:25px;">fårefold</text>
  </g>
  <g transform="translate(505 1220)">
    <circle cx="-25" cy="0" r="13" fill="#bc922d" stroke="#5a4218" stroke-width="3"/>
