  <text x="1525" y="1852" class="legend">H11 Kildehuset</text>
  <text x="1525" y="1883" class="legend">H12 Lerbrænderne</text>
  <text x="1525" y="1914" class="legend">H13 Skriverhuset | H18 Ruin</text>
  <text x="1525" y="1945" class="legend">H14 Gedestalden | H15-H17</text>

  <rect x="74" y="74" width="1900" height="1900" rx="20" fill="none" stroke="#5a3d25" stroke-width="7"/>
