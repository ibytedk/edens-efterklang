    <path d="M-35,22 L34,-24 M-25,-30 L42,28" stroke="#1c140f" stroke-width="8"/>
    <use xlink:href="#labelbox" y="78"/><text y="86" text-anchor="middle" class="label">H18</text>
  </g>

  <!-- Landskabsmarkører tæt på byen -->
  <g transform="translate(1495 640)">
    <ellipse class="water" cx="0" cy="0" rx="70" ry="40"/>
