[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edens-dm"
version = "0.1.0"
description = "Cloud-first, stemmestyret BECMI Dungeon Master til Discord."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<0.29",
  "orjson>=3.10,<4",
  "pgvector>=0.3,<0.4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
discord = [
  "py-cord>=2.7,<3",
]
audio = [
  "websockets>=12,<16",
]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<6",
]

[project.scripts]
edens-dm = "edens_dm.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
edens_dm = ["data/becmi/*.json", "prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
